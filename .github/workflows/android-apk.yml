name: Собрать Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Установить pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Установить JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Создать Android-проект
        run: pnpm exec cap add android

      - name: Собрать приложение и синхронизировать Android
        run: pnpm android:sync

      - name: Собрать APK
        run: cd android && ./gradlew assembleDebug

      - name: Прикрепить APK к релизу
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.0 android/app/build/outputs/apk/debug/app-debug.apk --clobber
